<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>//_SYSTEM_PORTFOLIO_ACCESS</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <style>
        body {
            margin: 0;
            background: #001100;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            color: #00ff00;
        }
        #crt {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
            background: linear-gradient(rgba(0, 32, 0, 0.1) 50%, rgba(0, 0, 0, 0.25) 50%),
                        linear-gradient(90deg, rgba(0, 255, 0, 0.03), rgba(0, 255, 0, 0.01));
            background-size: 100% 4px, 4px 100%;
            animation: scanline 0.1s linear infinite;
        }
        #terminal {
            padding: 2rem;
            text-shadow: 0 0 8px #00ff0040;
            position: relative;
            z-index: 2;
        }
        .prompt {
            color: #00ff00;
            border-bottom: 2px solid #00ff00;
            margin: 1rem 0;
            cursor: pointer;
        }
        .sketch-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }
        @keyframes scanline {
            0% { background-position: 0 0; }
        }
    </style>
</head>
<body>
    <div id="crt"></div>
    <div id="terminal"></div>
    <audio id="bleep"><source src="https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg" type="audio/ogg"></audio>

    <script>
        const sketches = [
            { id: "CYBER_PATTERNS", code: "-RG47tNtH", fn: (p) => {
                // Original sketch code from https://editor.p5js.org/JVA/sketches/-RG47tNtH
                p.setup = () => {
                    p.createCanvas(800, 800);
                    p.noFill();
                    p.stroke(255);
                };
                p.draw = () => {
                    p.background(0);
                    for(let i = 0; i < 100; i++) {
                        p.push();
                        p.translate(p.width/2, p.height/2);
                        p.rotate(p.frameCount * 0.002 * i);
                        p.stroke(p.map(p.sin(p.frameCount*0.01), -1,1, 50,255));
                        p.rect(0,0, i*10, i*10, i*2);
                        p.pop();
                    }
                };
            }},
            // Add similar implementations for other sketches...
        ];

        let currentSketch = null;

        function setup() {
            terminalBootSequence();
            simulateCorruption();
        }

        function terminalBootSequence() {
            const term = document.getElementById('terminal');
            let lines = [
                "INITIALIZING Mjölnir OS v7.4.3...",
                "MOUNTING /dev/artifacts...",
                "✓ LOADED Durandal AI Module",
                "ACCESS LEVEL: BLACK OPERATIVE",
                `${sketches.length} ARTIFACTS DETECTED:`
            ];

            sketches.forEach((sketch, i) => {
                lines.push(`${i+1}. [${sketch.id}] <-- ${"■".repeat(3+i)}-->`);
            });

            lines.push("\nSELECT ARTIFACT >");
            
            typewriterEffect(lines.join('\n'), term, () => {
                sketches.forEach((sketch) => {
                    const prompt = document.createElement('div');
                    prompt.className = 'prompt';
                    prompt.innerHTML = `./access --artifact=${sketch.id}`;
                    prompt.onclick = () => loadSketch(sketch);
                    term.appendChild(prompt);
                });
            });
        }

        function loadSketch(sketch) {
            document.getElementById('terminal').style.display = 'none';
            
            const container = document.createElement('div');
            container.className = 'sketch-container';
            document.body.appendChild(container);

            currentSketch = new p5(sketch.fn, container);
            
            const returnBtn = document.createElement('div');
            returnBtn.style.position = 'fixed';
            returnBtn.style.top = '10px';
            returnBtn.style.left = '10px';
            returnBtn.style.color = '#0f0';
            returnBtn.style.cursor = 'pointer';
            returnBtn.style.zIndex = '1000';
            returnBtn.innerHTML = '[RETURN TO TERMINAL]';
            returnBtn.onclick = () => {
                currentSketch.remove();
                container.remove();
                returnBtn.remove();
                document.getElementById('terminal').style.display = 'block';
            };
            document.body.appendChild(returnBtn);
        }

        // Keep previous typewriterEffect and simulateCorruption functions
    </script>
</body>
</html>
